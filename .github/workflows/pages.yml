name: Deploy widget to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build-time tools + the JS extensions for widgets and Plotly
      - name: Install build tools
        run: pip install voici-core jupyterlite-pyodide-kernel ipywidgets plotly

      # Notebook becomes index.ipynb; approx package sits beside it so imports work
      - name: Stage site content
        run: |
          mkdir -p site_content
          cp website_widget/approximate_widgets.ipynb site_content/index.ipynb
          cp -r approx site_content/approx
          find site_content -name '__pycache__' -prune -exec rm -rf {} +
          rm -f site_content/approx/*.cs

      - name: Build static site
        run: voici build --contents site_content --output-dir dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4